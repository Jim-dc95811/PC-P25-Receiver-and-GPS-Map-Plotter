 background:rgba(13,20,28,.98);border:1px solid #27404f;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.5)}

 background:radial-gradient(120% 90% at 50% 18%,#15314a 0%,#0b0f14 72%);transition:opacity .6s ease;text-align:center;padding:20px}

#banner{position:fixed;left:0;right:0;z-index:645;display:none;text-align:center;font-weight:700;color:#fff;
 background:#c0392b;padding:9px;top:calc(46px + env(safe-area-inset-top,0px))}
.ulbl{background:rgba(11,15,20,.74);border:none;color:#fff;font-weight:600;font-size:13px;box-shadow:none;padding:1px 6px;border-radius:4px}
.ulbl::before{display:none}
.leaflet-container{background:#0b0f14}
.leaflet-top{top:calc(52px + env(safe-area-inset-top,0px))}
#amenu .newid{flex:0 0 108px;min-width:0}
#amenu .act .alt{background:#17344a;border:1px solid #255277;color:#bfe0ff}
#menu a.pick{color:#7fd1ff;font-weight:700}
#listen{pointer-events:auto;cursor:pointer;background:#1f3a52;color:#bfe0ff;border:1px solid #255277;border-radius:7px;
 padding:5px 10px;font-size:13px;font-weight:600;white-space:nowrap}
#listen.on{background:#1f6b3a;border-color:#3fae63;color:#eafff0}
#speaker{position:fixed;z-index:646;left:50%;transform:translateX(-50%);top:calc(54px + env(safe-area-inset-top,0px));
 display:none;align-items:center;gap:11px;background:rgba(18,30,40,.95);border:1px solid #2b6b4a;border-radius:22px;
 padding:7px 15px;color:#eafff0;font-weight:700;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.45)}

#phonebox{position:fixed;z-index:650;top:calc(44px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));
  display:none;background:#0d1a24;border:1px solid #23384f;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.6);min-width:210px;max-width:84vw;padding-bottom:12px}
#phonebox h4{font-size:12px;letter-spacing:.6px;color:#7f98ad;font-weight:700;padding:11px 14px 6px;text-transform:uppercase}
#phonebox .qrwrap{background:#fff;border-radius:8px;margin:0 14px;padding:8px;display:flex;justify-content:center}
#phonebox .qrwrap img{width:180px;height:180px;image-rendering:pixelated;display:block}
#phonebox .purl{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:#7fd1ff;text-align:center;padding:9px 12px 2px;word-break:break-all}

</style></head><body>
<div id="map"></div>
<div id="bar"><span id="title">McNALLY P25 &middot; v2.2</span><span id="mapname"></span>
<span id="status"><button id="listen">&#128266; Listen</button><button id="alias">&#127991; Alias</button><button id="maps">&#128506; Maps</button><button id="phone">&#128241; Phone</button><span id="nac"></span><span id="clock">--:--:--</span><span id="count">0 units</span><i id="dot"></i></span></div>
<div id="menu"></div>
<div id="amenu"></div>
<div id="phonebox"></div>
<div id="banner"></div>
<div id="speaker"><span id="spkname"></span><span id="spkrb"></span></div>
<div id="splash">
<svg width="152" height="138" viewBox="0 0 152 138" aria-label="Claude McNally's P25 Receiver — fire-lookout tower over a sunset ridge">
 <circle cx="76" cy="60" r="34" fill="#f2a63b" opacity=".18"/><circle cx="76" cy="64" r="21" fill="#f2a63b" opacity=".42"/>
 <path d="M0 106 L30 94 L62 102 L92 90 L122 100 L152 92 L152 138 L0 138 Z" fill="#0e2233"/>
 <g stroke="#1c3a52" stroke-width="3" fill="none" stroke-linecap="round">
  <path d="M60 102 L68 54"/><path d="M92 102 L84 54"/><path d="M66 82 L86 82"/><path d="M63 68 L89 68"/></g>
 <rect x="60" y="38" width="32" height="20" rx="2" fill="#13263a" stroke="#2b5574" stroke-width="2"/>
 <rect x="64" y="42" width="9" height="11" fill="#ffd166"/><rect x="79" y="42" width="9" height="11" fill="#ffd166"/>
 <path d="M55 38 L76 28 L97 38 Z" fill="#1c3a52"/><path d="M76 28 L76 18" stroke="#2b5574" stroke-width="2"/>
 <circle cx="76" cy="17" r="2.4" fill="#e85d3b"/></svg>
<div class="brand">Claude McNally&rsquo;s</div>
<div class="model">PC P25 Receiver &amp; GPS Map Plotter</div>
<div class="tag">P25 location &amp; voice, off the air &middot; your own offline maps &middot; no cloud</div>
<div class="sig">an original, built by Claude McNally</div>
</div>
<script src="/leaflet.js"></script>
<script>
// This page shows ONE map. The router has no default: root ("/") shows whichever map sorts first
// (crews order by file name, e.g. "1_" / "a_"); a named map lives at /m/<slug>. Every map is equal.
var PATHBASE = location.pathname.replace(/\/(map|index\.html)\/?$/,"").replace(/\/+$/,"");
var atRoot = (PATHBASE === "");
var TILEBASE = null;              // "/m/<slug>" of the map actually shown; set once /maps.json loads
var map = L.map("map",{zoomControl:true, attributionControl:false});
map.setView([30.40,-81.93], 12);   // sane default; re-centers on the map / units once loaded
var markers={}, tilesAdded=false, userMoved=false;
var GREEN="#2ecc71", AMBER="#f1c40f", SELF="#17c3b2", SELF_ID="LOOKOUT";
// The map frames itself once on load; after that the user owns the view. Units are drawn where
// they are but NEVER move the display - IDs key up from all over and must not drag it around.
// Track any user pan/zoom so even the one-time load-framing never yanks a view they've grabbed.
function markMoved(){ userMoved=true; }
map.on("dragstart", markMoved);
map.getContainer().addEventListener("wheel", markMoved, {passive:true});
function esc(s){return (s+"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function setupTiles(meta){
  if(tilesAdded || !meta.has_tiles || TILEBASE===null) return;
  tilesAdded=true;
  var b=meta.bounds, sw=[b[1],b[0]], ne=[b[3],b[2]];
  L.tileLayer(TILEBASE+"/tiles/{z}/{x}/{y}",{minZoom:meta.minzoom, maxZoom:22, maxNativeZoom:meta.maxzoom, bounds:[sw,ne],
    errorTileUrl:"data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="}).addTo(map);
  map.setMaxBounds([[sw[0]-0.08,sw[1]-0.08],[ne[0]+0.08,ne[1]+0.08]]);
  // Frame the whole map once on load. There is no auto-fit to units: IDs pop in from all over,
  // so they must never move the display. Skip even this if the user already moved.
  if(!userMoved){ map.fitBounds([sw,ne]); }
}
// Keep asking for this map's tiles until its drive is ready (survives a cold boot where the USB
// auto-mount finishes AFTER this service starts: the map appears the instant it mounts).
function pollMeta(){
  if(TILEBASE===null) return;           // no map resolved yet (none on the drive) - loadMaps retries
  fetch(TILEBASE+"/meta.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(meta){
    if(meta.has_tiles) setupTiles(meta); else setTimeout(pollMeta,4000);
  }).catch(function(){ setTimeout(pollMeta,4000); });
}
// Maps menu + which map this page shows. No default: root shows whichever sorts first.
function loadMaps(){
  fetch("/maps.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
    var maps=d.maps||[], cur=null;
    if(atRoot){ cur = maps[0] || null; }    // root -> first map alphabetically (named by the crew)
    else { maps.forEach(function(mp){ if(mp.base.replace(/\/+$/,"")===PATHBASE) cur=mp; }); }
    if(cur && TILEBASE===null){ TILEBASE = cur.base.replace(/\/+$/,""); pollMeta(); }  // first resolve
    var html='<h4>Maps</h4>';
    if(maps.length===0){ html+='<a class="cur"><span class="sub">No maps yet &middot; use "Pick a map" below to choose a .tpkx / .mbtiles file</span></a>'; }
    maps.forEach(function(mp){
      var isCur = cur && (mp.base===cur.base);
      html+='<a href="'+mp.base+'" class="'+(isCur?"cur":"")+'">'+esc(mp.name)+'</a>';
    });
    html+='<a href="#" class="pick" id="pickmap">&#128193; Pick a map (.tpkx)&hellip;</a>';
    document.getElementById("menu").innerHTML=html;
    var pf=document.getElementById("pickmap"); if(pf) pf.onclick=changeMap;
    document.getElementById("mapname").textContent = cur ? "· "+cur.name : "";
  }).catch(function(){});
}
// Let the user point The Traveler PC at ANY folder of maps on this PC (remembered).
// /pick-folder opens a native folder dialog on this PC; then we reload to show the new folder.
function changeMap(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  var mn=document.getElementById("menu");
  mn.innerHTML='<h4>Maps</h4><a class="cur"><span class="sub">Opening the map picker on this PC &mdash; choose a .tpkx / .mbtiles file&hellip;</span></a>';
  fetch("/pick-map").then(function(r){return r.json()}).then(function(d){
    if(d && d.ok && d.slug){ location.href = "/m/"+d.slug+"/"; }   // jump to the picked map
    else { loadMaps(); }                                           // cancelled - refresh the list
  }).catch(function(){ loadMaps(); });
}
document.getElementById("maps").onclick=function(e){
  e.stopPropagation();
  var m=document.getElementById("menu");
  m.style.display = (m.style.display==="block") ? "none" : "block";
};
document.addEventListener("click",function(){ document.getElementById("menu").style.display="none"; });

function tick(){
  fetch("/units.json",{cache:"no-store"}).then(function(r){return r.json()}).then(update)
  .catch(function(){ document.getElementById("dot").className="bad";
    document.getElementById("clock").textContent="reconnecting"; });
}
// Range + true-north bearing from a (MY POSITION) to b (the talking unit).
// Returns "" unless BOTH ends have a valid fix -- same as the BK: no heading to
// a radio that hasn't reported GPS, and none without our own position. Great-
// circle (haversine) range in miles; initial bearing in true degrees, 3-digit.
function relRangeBrg(a,b){
  if(!a||!b) return "";
  var la=+a.lat, oa=+a.lon, lb=+b.lat, ob=+b.lon;
  if(!isFinite(la)||!isFinite(oa)||!isFinite(lb)||!isFinite(ob)) return "";
  var R=3958.8, d2r=Math.PI/180;
  var p1=la*d2r, p2=lb*d2r, dp=(lb-la)*d2r, dl=(ob-oa)*d2r;
  var h=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
  var mi=2*R*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
  var y=Math.sin(dl)*Math.cos(p2), x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  var bd=(Math.round(Math.atan2(y,x)/d2r)+360)%360;
  var bs=""+bd; while(bs.length<3) bs="0"+bs;
  var ds=mi<10?mi.toFixed(1):(""+Math.round(mi));
  return " · "+ds+" mi · "+bs+"°";
}
function update(d){
  document.getElementById("dot").className="";
  document.getElementById("clock").textContent=d.server_time;
  document.getElementById("count").textContent=d.count+(d.count==1?" unit":" units");
  var nel=document.getElementById("nac"); if(nel) nel.textContent=d.nac?("NAC 0x"+d.nac):"";   // system NAC (hex), persists once heard
  var ban=document.getElementById("banner");
  if(d.alarm&&d.alarm.down){ban.style.display="block";ban.textContent="⚠ RADIO LINK DOWN — "+d.alarm.why;}
  else ban.style.display="none";
  // CURRENT SPEAKER: the combo platter's join -- the talking unit lit by its id,
  // with range + true-north bearing from MY POSITION (both ends need a fix).
  var sp=d.speaker, spel=document.getElementById("speaker");
  if(sp){ spel.classList.add("on");
    document.getElementById("spkname").textContent="🔊 "+sp.name+" speaking";
    var me=null,them=null;
    d.units.forEach(function(u){ if(u.id===SELF_ID)me=u; if(u.id===sp.id)them=u; });
    document.getElementById("spkrb").textContent=(sp.tgid!=null?" · TG "+sp.tgid:"")+relRangeBrg(me,them);
  } else spel.classList.remove("on");
  var seen={};
  d.units.forEach(function(u){
    seen[u.id]=1; var ll=[u.lat,u.lon], self=(u.id===SELF_ID), talking=sp&&(u.id===sp.id);
    var col=self?SELF:(u.stale?AMBER:GREEN), rad=(self?9:7)+(talking?4:0);
    var lab=(talking?"🔊 ":"")+(self?("MY POSITION · "+u.age):(u.name+" · "+u.age+(u.stale?" (stale)":"")));
    if(markers[u.id]){ markers[u.id].setLatLng(ll).setRadius(rad)
        .setStyle({color:talking?"#eafff0":col,fillColor:col,weight:talking?5:(self?3:2)}); markers[u.id].setTooltipContent(lab); }
    else { var m=L.circleMarker(ll,{radius:rad,color:talking?"#eafff0":col,fillColor:col,fillOpacity:1,weight:talking?5:(self?3:2)}).addTo(map);
           m.bindTooltip(lab,{permanent:true,direction:"right",className:"ulbl",offset:[8,0]}); markers[u.id]=m; }
  });
  Object.keys(markers).forEach(function(id){ if(!seen[id]){ map.removeLayer(markers[id]); delete markers[id]; }});
  // (No auto-pan to units: they key up from everywhere and must never move the display.)
}

// ---- Listen: play the decoded voice stream (WebSocket PCM -> Web Audio) ----
// The combo platter's audio: the Traveler PC decodes voice to 8 kHz PCM and
// streams it on ws://<host>:8081; one tap on Listen plays it here. Browsers
// block autoplay until a click, so the voice starts on that tap. Auto-reconnects.
var AC=null, vws=null, wantAudio=false;
function openVoice(){
  if(vws) return;
  try{ vws=new WebSocket("ws://"+location.hostname+":8081"); }catch(e){ return; }
  vws.binaryType="arraybuffer";
  var playAt=0;
  vws.onopen=function(){ playAt=AC.currentTime+0.15; };
  vws.onmessage=function(ev){
    var i16=new Int16Array(ev.data); if(!i16.length) return;
    var buf=AC.createBuffer(1,i16.length,8000), ch=buf.getChannelData(0);
    for(var i=0;i<i16.length;i++){ ch[i]=i16[i]/32768; }
    var src=AC.createBufferSource(); src.buffer=buf; src.connect(AC.destination);
    var now=AC.currentTime; if(playAt<now) playAt=now+0.05;
    src.start(playAt); playAt+=buf.duration;
  };
  vws.onclose=function(){ vws=null; if(wantAudio) setTimeout(openVoice,1000); };   // auto-reconnect
  vws.onerror=function(){ try{vws.close();}catch(e){} };
}
document.getElementById("listen").onclick=function(e){
  e.stopPropagation();
  var btn=this;
  if(!wantAudio){
    wantAudio=true;
    if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(err){ wantAudio=false; return; } }
    if(AC.state==="suspended") AC.resume();
    openVoice(); btn.classList.add("on"); btn.innerHTML="&#128266; Listening";
  } else {
    wantAudio=false; if(vws){ try{vws.close();}catch(e){} } vws=null;
    btn.classList.remove("on"); btn.innerHTML="&#128266; Listen";
  }
};
loadMaps();                    // resolves which map to show, then kicks pollMeta() for its tiles
tick(); setInterval(tick,3000);
setInterval(loadMaps,30000);   // pick up newly-added maps without a reload

// ---- Alias: rename a raw unit id to a crew name, right from the map ----
// Wires to units_kml's token-guarded /admin/aliases (default token "lookout").
// aliases.json is read live, so a saved name shows on the map within one refresh.
var ATOKEN = "lookout";
function renderAlias(){
  var box=document.getElementById("amenu");
  Promise.all([
    fetch("/admin/aliases?token="+ATOKEN).then(function(r){return r.json()}).catch(function(){return {aliases:{}};}),
    fetch("/units.json",{cache:"no-store"}).then(function(r){return r.json()}).catch(function(){return {units:[]};})
  ]).then(function(res){
    var al=(res[0]&&res[0].aliases)||{}, units=(res[1]&&res[1].units)||[], ids={};
    units.forEach(function(u){ if(u.id!==SELF_ID) ids[u.id]=1; });   // fleet radios only (not MY POSITION)
    Object.keys(al).forEach(function(k){ ids[k]=1; });               // keep names for units not heard right now
    var keys=Object.keys(ids).sort();
    var html='<h4>Name your units</h4>';
    keys.forEach(function(id){
      html+='<div class="row"><span class="uid">'+esc(id)+'</span>'+
            '<input data-id="'+esc(id)+'" value="'+esc(al[id]||"")+'" placeholder="crew name" maxlength="64"></div>';
    });
    html+='<div class="row addrow"><input class="newid" placeholder="unit ID" maxlength="24" inputmode="numeric">'+
          '<input class="newname" placeholder="crew name" maxlength="64"></div>';
    html+='<div class="act"><button id="asave">Save names</button></div>'+
          '<div id="amsg">Type any unit ID above to name it before it ever transmits.</div>';
    box.innerHTML=html;
    var s=document.getElementById("asave"); if(s) s.onclick=saveAlias;
  });
}
function saveAlias(){
  var tbl={};
  Array.prototype.forEach.call(document.querySelectorAll("#amenu input[data-id]"),function(inp){
    var id=inp.getAttribute("data-id"), nm=(inp.value||"").trim();
    if(nm) tbl[id]=nm;
  });
  var nid=document.querySelector("#amenu .newid"), nn=document.querySelector("#amenu .newname");
  if(nid && nid.value.trim() && nn && nn.value.trim()){ tbl[nid.value.trim()]=nn.value.trim(); }
  var msg=document.getElementById("amsg"); if(msg) msg.textContent="saving ...";
  fetch("/admin/aliases?token="+ATOKEN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(tbl)})
   .then(function(r){return r.json()}).then(function(d){
     if(d&&d.ok){ tick(); renderAlias(); }
     else if(msg) msg.textContent = "Could not save: "+((d&&d.error)||"check the server");
   }).catch(function(e){ if(msg) msg.textContent="Could not save: "+e; });
}
document.getElementById("alias").onclick=function(e){
  e.stopPropagation();
  document.getElementById("menu").style.display="none";
  var b=document.getElementById("amenu");
  if(b.style.display==="block"){ b.style.display="none"; return; }
  b.style.display="block"; renderAlias();
};
document.getElementById("amenu").addEventListener("click",function(e){ e.stopPropagation(); });   // clicks inside stay open
document.addEventListener("click",function(){ document.getElementById("amenu").style.display="none"; });
document.getElementById("maps").addEventListener("click",function(){ document.getElementById("amenu").style.display="none"; });

// ---- Phone: show a QR of this box's LAN address so a phone can scan and open the map ----
document.getElementById("phone").onclick=function(e){
  e.stopPropagation();
  document.getElementById("menu").style.display="none";
  document.getElementById("amenu").style.display="none";
  var p=document.getElementById("phonebox");
  if(p.style.display==="block"){ p.style.display="none"; return; }
  p.innerHTML='<h4>Open on your phone</h4>'+
    '<div class="qrwrap"><img id="qrimg" alt="QR to open this map"></div>'+
    '<div class="purl" id="purl">&hellip;</div>'+
    '<div class="phint">Scan with your phone&rsquo;s camera. Same Wi-Fi, no app, no typing.</div>';
  document.getElementById("qrimg").src="/qr.svg?t="+Date.now();   // server fills in its own LAN IP each time
  fetch("/phone",{cache:"no-store"}).then(function(r){return r.json();})
    .then(function(d){ var u=document.getElementById("purl"); if(u&&d&&d.url) u.textContent=d.url; })
    .catch(function(){});
  p.style.display="block";
};

document.getElementById("alias").addEventListener("click",function(){ document.getElementById("phonebox").style.display="none"; });
document.getElementById("maps").addEventListener("click",function(){ document.getElementById("phonebox").style.display="none"; });

// ---- Claude McNally startup badge: the maker's nameplate on screen start, then it clears to the map ----
(function(){
  var s=document.getElementById("splash"); if(!s) return;
  var shown=false; try{ shown=sessionStorage.getItem("tpc_badge")==="1"; }catch(e){}
  if(shown){ s.style.display="none"; return; }   // once per session (a folder-change reload won't re-badge)
  try{ sessionStorage.setItem("tpc_badge","1"); }catch(e){}
  function go(){ s.classList.add("hide"); setTimeout(function(){ s.style.display="none"; },700); }
  s.addEventListener("click", go);
  setTimeout(go, 2600);
})();
</script></body></html>
